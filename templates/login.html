<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | CloudBus</title>
    <style>
        body {
            font-family: Arial;
            background: #eef3f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 35px;
            width: 330px;
            border-radius: 15px;
            box-shadow: 0 5px 25px #0002;
        }
        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border-radius: 7px;
        }
        input { border: 1px solid #ccc; }
        button {
            background: #1765a8;
            color: white;
            border: none;
            cursor: pointer;
        }
        a { color: #1765a8; }
        .error { color: #c62828; }
        .success { color: #16834a; }
    </style>
</head>
<body>
<div class="container">
    <h2>Welcome Back</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="{{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="email" name="email"
               placeholder="Email Address" required>

        <input type="password" name="password"
               placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p>New user? <a href="/register">Create Account</a></p>
    <a href="/">Back to Home</a>
</div>
</body>
</html>
